seed: 42

data:
  train_audio_dir: data/clotho/development
  train_caption_csv: data/clotho/clotho_captions_development.csv
  val_audio_dir: data/clotho/validation
  val_caption_csv: data/clotho/clotho_captions_validation.csv
  sample_rate: 16000
  train_caption_mode: random
  val_caption_mode: first
  batch_size: 4
  num_workers: 4
  max_caption_tokens: 32
  tokenizer_name: facebook/bart-base

model:
  bart:
    vocab_size: 50265
    pad_token_id: 1
    bos_token_id: 0
    eos_token_id: 2
    decoder_start_token_id: 2
    d_model: 768
    decoder_layers: 6
    decoder_ffn_dim: 3072
    decoder_attention_heads: 12
    max_position_embeddings: 256
    dropout: 0.1
    attention_dropout: 0.1
    activation_dropout: 0.1

  beats_encoder:
    trainable: true
    n_mels: 128
    n_fft: 1024
    hop_length: 320
    hidden_size: 512
    num_heads: 8
    ff_multiplier: 4
    num_layers: 4
    dropout: 0.1
    aggregation_hidden_size: 768

  convnext_encoder:
    trainable: true
    n_mels: 128
    n_fft: 1024
    hop_length: 640
    hidden_size: 384
    dropout: 0.1

  fusion:
    stage: early
    mode: feature
    output_dim: 768
    dropout: 0.1

  conformer:
    input_dim: 768
    num_heads: 8
    ffn_dim: 1536
    num_layers: 2
    depthwise_conv_kernel_size: 31
    dropout: 0.1

training:
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  max_steps: 10000
  grad_clip_val: 1.0
  precision: 16-mixed
  accelerator: auto
  devices: auto
  strategy: auto
  log_every_n_steps: 10
  val_check_interval: 1.0
  limit_val_batches: 1.0
  accumulate_grad_batches: 1
  freeze_modules: []
  validation_preview_count: 4

logging:
  project: automatic-audio-captioning-ml-2026
  run_name: dcase24-baseline-scaffold
  save_dir: outputs
  use_wandb: true
